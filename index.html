<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Echo · 英文语音翻译</title>
  <style>
    :root { color-scheme: dark; --bg:#0e1118; --card:#171c26; --line:#293241; --muted:#8e9aac; --text:#f4f7fb; --accent:#75e0c3; --accent2:#76a9ff; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif; color:var(--text); background:radial-gradient(circle at 75% 0%,#213a4e 0,transparent 33%),var(--bg); }
    main { width:min(980px,calc(100% - 36px)); margin:0 auto; padding:64px 0 52px }
    .eyebrow { color:var(--accent); letter-spacing:.14em; font-size:12px; font-weight:700; text-transform:uppercase }
    h1 { font-size:clamp(34px,6vw,64px); line-height:1; letter-spacing:-.055em; margin:15px 0 18px; max-width:700px }
    .intro { color:var(--muted); font-size:17px; line-height:1.65; max-width:610px; margin-bottom:38px }
    .panel { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px }
    .card { background:linear-gradient(145deg,rgba(31,39,52,.92),rgba(19,24,34,.94)); border:1px solid var(--line); border-radius:22px; padding:25px; min-height:245px; box-shadow:0 20px 60px #0002 }
    .card h2 { margin:0 0 8px; font-size:14px; color:var(--muted); font-weight:600; letter-spacing:.04em }
    .label { color:var(--accent); font-size:12px; font-weight:700; margin-bottom:20px }
    .result { white-space:pre-wrap; font-size:20px; line-height:1.7; min-height:130px; color:#eaf0f7 }
    .empty { color:#627083; font-size:16px }
    .control { display:flex; align-items:center; gap:18px; border:1px solid var(--line); border-radius:22px; padding:20px 24px; background:#141923 }
    button { border:0; cursor:pointer; color:#071414; background:var(--accent); border-radius:999px; font:inherit; font-weight:750; padding:14px 23px; transition:.2s transform,.2s opacity; }
    button:hover { transform:translateY(-1px) } button:disabled { opacity:.5; cursor:not-allowed; transform:none }
    .record { width:58px; height:58px; padding:0; border-radius:50%; font-size:0; position:relative; flex:none }
    .record:after { content:""; position:absolute; inset:19px; background:#0b2928; border-radius:50%; transition:.2s }
    .record.active { background:#ff8b8b; box-shadow:0 0 0 9px #ff8b8b18 } .record.active:after { border-radius:5px; inset:20px }
    .status { font-size:15px; color:var(--muted); flex:1; line-height:1.5 }
    .status strong { color:var(--text); display:block; margin-bottom:3px }
    .meta { display:flex; justify-content:space-between; color:#657285; font-size:12px; margin-top:20px }
    .error { color:#ff9b9b; margin:12px 4px 0; font-size:13px; min-height:18px }
    @media(max-width:700px){ main{padding-top:38px}.panel{grid-template-columns:1fr}.card{min-height:200px}.control{padding:16px} }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">ECHO / VOICE TRANSLATOR</div>
    <h1>听见英文，<br><span style="color:var(--accent)">看见中文。</span></h1>
    <p class="intro">按住录音按钮说一段英文。松开后，Echo 会自动完成英文转写，并给出自然的简体中文翻译。</p>
    <section class="panel">
      <article class="card"><div class="label">01 / ENGLISH TRANSCRIPT</div><h2>英文原文</h2><div id="english" class="result empty">录音后，英文内容会显示在这里</div></article>
      <article class="card"><div class="label" style="color:var(--accent2)">02 / CHINESE TRANSLATION</div><h2>中文翻译</h2><div id="chinese" class="result empty">中文翻译会显示在这里</div></article>
    </section>
    <div class="control"><button id="record" class="record" aria-label="开始录音"></button><div class="status"><strong id="statusTitle">准备就绪</strong><span id="statusText">点击圆形按钮开始录音，字幕将每 4 秒更新</span></div><button id="clear" disabled>清空</button></div>
    <div id="error" class="error"></div>
    <div class="meta"><span>本地运行 · API Key 仅保存在服务端</span><span id="timer">00:00</span></div>
  </main>
  <script>
    const record = document.querySelector('#record'), clear = document.querySelector('#clear');
    const english = document.querySelector('#english'), chinese = document.querySelector('#chinese');
    const title = document.querySelector('#statusTitle'), text = document.querySelector('#statusText'), error = document.querySelector('#error'), timer = document.querySelector('#timer');
    let recorder, stream, chunks = [], started, interval, segmentTimer, stopping = false, processing = 0;
    const setResult = (el, value, empty) => { el.textContent = value || empty; el.classList.toggle('empty', !value); };
    function clock(){ const s=Math.floor((Date.now()-started)/1000); timer.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
    function makeRecorder(){ recorder=new MediaRecorder(stream,{mimeType:'audio/webm'}); chunks=[]; recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data); recorder.onstop=()=>{ const blob=new Blob(chunks,{type:'audio/webm'}); if(blob.size) upload(blob); if(!stopping) startSegment(); }; recorder.start(); segmentTimer=setTimeout(()=>{ if(recorder.state==='recording') recorder.stop(); },4000); }
    function startSegment(){ if(!stopping) makeRecorder(); }
    async function begin(){ error.textContent=''; try { stream=await navigator.mediaDevices.getUserMedia({audio:true}); stopping=false; started=Date.now(); interval=setInterval(clock,500); startSegment(); record.classList.add('active'); title.textContent='正在实时字幕'; text.textContent='正在收音，字幕会分段更新；再次点击结束'; } catch(e){ error.textContent='无法访问话筒：请允许浏览器使用麦克风，并通过 localhost 打开本页面。'; } }
    function end(){ if(!recorder||stopping)return; stopping=true; clearTimeout(segmentTimer); clearInterval(interval); if(recorder.state==='recording')recorder.stop(); if(stream)stream.getTracks().forEach(t=>t.stop()); record.classList.remove('active'); title.textContent='正在完成最后一段'; text.textContent='最后一段字幕处理完成后就会显示'; }
    async function upload(blob){ processing++; try { const data=new FormData(); data.append('audio',blob,'recording.webm'); const res=await fetch('/api/process',{method:'POST',body:data}); const json=await res.json(); if(!res.ok)throw new Error(json.error||'处理失败'); if(json.english){ english.classList.remove('empty'); english.textContent=(english.textContent==='录音后，英文内容会显示在这里'?'':english.textContent+'\n')+json.english; } if(json.chinese){ chinese.classList.remove('empty'); chinese.textContent=(chinese.textContent==='中文翻译会显示在这里'?'':chinese.textContent+'\n')+json.chinese; } clear.disabled=false; } catch(e){ error.textContent=e.message; } finally { processing--; if(stopping&&processing===0){ title.textContent='处理完成'; text.textContent='可以继续录制下一段'; timer.textContent='00:00'; } } }
    record.onclick=()=>recorder&&recorder.state==='recording'?end():begin(); clear.onclick=()=>{setResult(english,'','录音后，英文内容会显示在这里');setResult(chinese,'','中文翻译会显示在这里');clear.disabled=true;error.textContent='';title.textContent='准备就绪';text.textContent='点击圆形按钮开始录音，字幕将每 4 秒更新';};
  </script>
</body>
</html>
