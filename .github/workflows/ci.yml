name: Desktop CI

on:
  push:
    branches:
      - main
      - feature/windows-preview
  pull_request:

jobs:
  macos-build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check PCM and loopback WebSocket transport
        run: python3 tests/run_stream_checks.py

      - name: Build Debug
        run: >-
          xcodebuild
          -project macOS/EchoMac.xcodeproj
          -scheme Echo
          -configuration Debug
          -sdk macosx
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build Release
        run: >-
          xcodebuild
          -project macOS/EchoMac.xcodeproj
          -scheme Echo
          -configuration Release
          -sdk macosx
          CODE_SIGNING_ALLOWED=NO
          build

  windows-build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore core checks with locked dependencies
        run: dotnet restore windows/Echo.CoreChecks/Echo.CoreChecks.csproj --locked-mode

      - name: Run core checks without audio devices or cloud services
        run: dotnet run --project windows/Echo.CoreChecks -c Release --no-restore

      - name: Restore WinUI app with locked dependencies
        run: dotnet restore windows/Echo.Windows/Echo.Windows.csproj --locked-mode /p:Platform=x64 /p:Configuration=Release /p:RuntimeIdentifier=win-x64

      - name: Build Release x64 without signing or launching
        run: dotnet build windows/Echo.Windows/Echo.Windows.csproj -c Release --no-restore /p:Platform=x64 /p:RuntimeIdentifier=win-x64
